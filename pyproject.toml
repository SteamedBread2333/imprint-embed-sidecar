[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imprint-embed-sidecar"
version = "0.2.0"
description = "imprint embed + relate sidecar (loopback HTTP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastembed>=0.4.2",
  "onnxruntime>=1.18.0",
  "sentence-transformers>=3.0.0",
  "PyYAML>=6.0",
]

[project.scripts]
imprint-embed-sidecar = "server:main"

[tool.setuptools]
py-modules = ["server", "relate", "config", "calibrate", "samples"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["imprint.plugin.json", "run.sh"]
